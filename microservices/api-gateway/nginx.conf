events { 
    worker_connections 1024; 
}

http {
    # CORRECCIÓN: DNS interno de Docker es 127.0.0.11
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # Captura cualquier ruta que empiece por /api/NOMBRE_SERVICIO/
        location ~ ^/api/([^/]+)(/.*)$ {
            set $service_name $1;
            set $service_uri  $2;

            # Nginx resuelve el nombre del contenedor dinámicamente usando la variable
            # Agregamos $is_args$args para no perder las variables por GET (?param=value)
            # Se preserva el prefijo /api y se agrega el sufijo -service al nombre
            proxy_pass http://$service_name-service:3000/api$service_uri$is_args$args;

            proxy_http_version 1.1;
            
            # Cabeceras necesarias para WebSockets (Chat Service)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Pasa la IP y el Host original al microservicio
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_cache_bypass $http_upgrade;
        }
    }
}