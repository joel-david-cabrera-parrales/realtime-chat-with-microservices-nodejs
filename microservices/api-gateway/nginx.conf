events { 
    worker_connections 1024; 
}

http {
    # CORRECCIÓN: DNS interno de Docker es 127.0.0.11
    resolver 127.0.0.11 valid=10s;

    # Solo envia "Connection: upgrade" cuando el cliente realmente pide un upgrade (WebSocket).
    # Antes se forzaba siempre y afectaba a las peticiones HTTP normales.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rutas publicas de la API -> microservicio que las sirve.
    # El prefijo publico se mantiene estable aunque el nombre interno del servicio cambie.
    map $api_service $upstream {
        auth         identity-service:3000;
        profile      identity-service:3000;
        file         media-service:3000;
        chat         messaging-service:3000;
        notification notification-service:3000;
        default      "";
    }

    server {
        listen 80;

        # Captura cualquier ruta que empiece por /api/NOMBRE_SERVICIO/
        location ~ ^/api/([^/]+)(/.*)?$ {
            set $api_service $1;

            # Servicio desconocido -> 404 con el envelope de error del gateway
            if ($upstream = "") {
                return 404 '{"statusCode":404,"success":false,"message":"El servicio \"$api_service\" no existe","error":"SERVICE_NOT_FOUND"}';
            }

            # Se pasa la URI original completa (path + query string)
            proxy_pass http://$upstream$request_uri;

            proxy_http_version 1.1;
            
            # Cabeceras necesarias para WebSockets (messaging-service)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Pasa la IP y el Host original al microservicio
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_cache_bypass $http_upgrade;

            # Las conexiones WebSocket son persistentes: sin esto nginx cortaria la
            # conexion tras 60 segundos de inactividad (valor por defecto).
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # El resto del tráfico público sirve la aplicación frontend.
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
