events { worker_connections 1024; }

http {
    # Definimos el DNS interno de Docker (suele ser 127.0.11.1 en redes bridge)
    resolver 127.0.11.1 valid=10s;

    server {
        listen 80;

        # Captura cualquier ruta que empiece por /api/NOMBRE_SERVICIO/
        location ~ ^/api/([^/]+)(/.*)$ {
            set $service_name $1;
            set $service_uri  $2;

            # Nginx resuelve el nombre del contenedor dinámicamente usando la variable
            proxy_pass http://$service_name:3000$service_uri;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}