events { 
    worker_connections 1024; 
}

http {
    # CORRECCIÓN: DNS interno de Docker es 127.0.0.11
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # Captura cualquier ruta que empiece por /api/NOMBRE_SERVICIO/
        location ~ ^/api/([^/]+)(/.*)?$ {
            set $service_name $1;

            # Se pasa la URI original completa (path + query string)
            proxy_pass http://$service_name-service:3000$request_uri;

            proxy_http_version 1.1;
            
            # Cabeceras necesarias para WebSockets (Chat Service)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Pasa la IP y el Host original al microservicio
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_cache_bypass $http_upgrade;
        }
    }
}