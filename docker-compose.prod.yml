name: realtime-messaging-platform-prod

services:
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./microservices/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      notification-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      user-profile-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      media-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - messaging-platform-network
  aws-local-s3:
    container_name: chat-s3
    image: localstack/localstack:latest
    ports:
      - "${AWS_STORAGE_SERVICE_PORT}:4566" # Puerto unificado de LocalStack
    environment:
      - LOCALSTACK_AUTH_TOKEN=${AWS_LOCAL_TOKEN}
      - SERVICES=${AWS_STORAGE_SERVICE}
      - AWS_DEFAULT_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - PERSISTENCE=1
    volumes:
      - "./volumes/aws-s3-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./microservices/media-service/aws/localstack-init:/etc/localstack/init/ready.d:ro"
    networks:
      - messaging-platform-network
  user-profile-service:
    container_name: user-profile-service
    build:
      context: ./microservices/user-profile-service
      dockerfile: Dockerfile
    env_file:
      - ./microservices/user-profile-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - messaging-platform-network
  identity-service:
    container_name: identity-service
    build:
      context: ./microservices/identity-service
      dockerfile: Dockerfile
    env_file:
      - ./microservices/identity-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - messaging-platform-network
  messaging-service:
    container_name: messaging-service
    build:
      context: ./microservices/messaging-service
      dockerfile: Dockerfile
    env_file:
      - ./microservices/messaging-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - messaging-platform-network
  notification-service:
    container_name: notification-service
    build:
      context: ./microservices/notification-service
      dockerfile: Dockerfile
    env_file:
      - ./microservices/notification-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - messaging-platform-network
  media-service:
    container_name: media-service
    build:
      context: ./microservices/media-service
      dockerfile: Dockerfile
    env_file:
      - ./microservices/media-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      aws-local-s3:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - messaging-platform-network
  frontend:
    container_name: chat-frontend
    build:
      context: ./frontend-zenith-ui/zenith-react
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - messaging-platform-network

  postgres:
    image: postgres:16
    container_name: messaging-platform-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      # Credenciales por base de datos: las consume init-scripts/01-init-databases.sh
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - '5440:5432'
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
      # Mapeamos la carpeta de scripts de inicialización automática
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      messaging-platform-network:
        aliases:
          - messaging-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  kafka:
    image: apache/kafka:4.1.0
    container_name: chat-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
    volumes:
      - ./volumes/kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - messaging-platform-network

networks:
  messaging-platform-network:
    driver: bridge
    enable_ipv6: true
