name: chat-app

services:
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./microservices/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      profile-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - chat-app-network
  aws-local-s3:
    container_name: chat-s3
    image: localstack/localstack:latest
    ports:
      - "${AWS_STORAGE_SERVICE_PORT}:4566" # Puerto unificado de LocalStack
    environment:
      - LOCALSTACK_AUTH_TOKEN=${AWS_LOCAL_TOKEN}
      - SERVICES=${AWS_STORAGE_SERVICE}
      - AWS_DEFAULT_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - PERSISTENCE=1
    volumes:
      - "./volumes/aws-s3-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./microservices/file-service/aws/localstack-init:/etc/localstack/init/ready.d:ro"
    networks:
      - chat-app-network
  profile-service:
    container_name: chat-profile-service
    build: 
      context: ./microservices/profile-service
      dockerfile: Dockerfile.dev
    env_file:
      - ./microservices/profile-service/.env
    networks:
      - chat-app-network
    volumes:
      - ./microservices/profile-service:/app
      - /app/node_modules/
    # healthcheck:
    #   test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 20s

  postgres:
    image: postgres:16
    container_name: chat-app-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE} 
    ports:
      - '5440:5432'
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
      # Mapeamos la carpeta de scripts de inicialización automática
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - chat-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    container_name: chat-pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '8088:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chat-app-network
    volumes:
      - ./volumes/pgadmin_data:/var/lib/pgadmin

networks:
  chat-app-network:
    driver: bridge
    enable_ipv6: true