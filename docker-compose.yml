name: chat-app

services:
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./microservices/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      notification-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      file-service:
        condition: service_healthy
    networks:
      - chat-app-network
  aws-local-s3:
    container_name: chat-s3
    image: localstack/localstack:latest
    ports:
      - "${AWS_STORAGE_SERVICE_PORT}:4566" # Puerto unificado de LocalStack
    environment:
      - LOCALSTACK_AUTH_TOKEN=${AWS_LOCAL_TOKEN}
      - SERVICES=${AWS_STORAGE_SERVICE}
      - AWS_DEFAULT_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - PERSISTENCE=1
    volumes:
      - "./volumes/aws-s3-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./microservices/file-service/aws/localstack-init:/etc/localstack/init/ready.d:ro"
    networks:
      - chat-app-network
  profile-service:
    container_name: profile-service
    build: 
      context: ./microservices/profile-service
      dockerfile: Dockerfile.dev
    env_file:
      - ./microservices/profile-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      file-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - chat-app-network
    volumes:
      - ./microservices/profile-service:/app
      - /app/node_modules/
  auth-service:
    container_name: auth-service
    build: 
      context: ./microservices/auth-service
      dockerfile: Dockerfile.dev
    env_file:
      - ./microservices/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - chat-app-network
    volumes:
      - ./microservices/auth-service:/app
      - /app/node_modules/
      - /app/node_modules/
  notification-service:
    container_name: notification-service
    build: 
      context: ./microservices/notification-service
      dockerfile: Dockerfile.dev
    env_file:
      - ./microservices/notification-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - chat-app-network
    volumes:
      - ./microservices/notification-service:/app
      - /app/node_modules/
  file-service:
    container_name: file-service
    build: 
      context: ./microservices/file-service
      dockerfile: Dockerfile.dev
    env_file:
      - ./microservices/file-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      aws-local-s3:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - chat-app-network
    volumes:
      - ./microservices/file-service:/app
      - /app/node_modules/

  postgres:
    image: postgres:16
    container_name: chat-app-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE} 
    ports:
      - '5440:5432'
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
      # Mapeamos la carpeta de scripts de inicialización automática
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      chat-app-network:
        aliases:
          - lumina-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  kafka:
    image: apache/kafka:4.1.0
    container_name: chat-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
    volumes:
      - ./volumes/kafka_data:/var/lib/kafka/data
    networks:
      - chat-app-network
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    container_name: chat-pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '8088:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chat-app-network
    volumes:
      - ./volumes/pgadmin_data:/var/lib/pgadmin

networks:
  chat-app-network:
    driver: bridge
    enable_ipv6: true
