name: chat-app

services:
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./microservices/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    # depends_on:
    networks:
      - chat-app-network

networks:
  chat-app-network:
    driver: bridge